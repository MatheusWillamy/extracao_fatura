services:
  eleveit01_extracao_fatura:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eleveit01_extracao_fatura
    restart: unless-stopped
    expose:
      - "8000"
    # Se estiver rodando localmente no seu computador e precisar acessar via localhost:8000,
    # descomente o bloco 'ports' abaixo. No Easypanel, use a aba 'Domains' para apontar à porta 8000.
    # ports:
    #   - "8000:8000"
    environment:
      - PORT=8000
      # Opcional: Se quiser usar fallback de IA (Gemini ou OpenRouter)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

